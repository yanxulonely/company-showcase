  <rect x="468" y="76" width="320" height="220" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.45"/>
  <rect x="812" y="76" width="320" height="220" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.35"/>
