  <text x="68" y="288" fill="none" stroke="#b8860b" stroke-width="2" font-size="40" font-family="PingFang SC, Microsoft YaHei, serif" font-weight="900" letter-spacing="6">梧桐苑惠</text>
  <text x="68" y="288" fill="url(#goldH)" font-size="40" font-family="PingFang SC, Microsoft YaHei, serif" font-weight="900" letter-spacing="6">梧桐苑惠</text>
