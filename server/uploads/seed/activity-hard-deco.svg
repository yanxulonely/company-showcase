<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="price" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="900" cy="150" rx="350" ry="250" fill="#3b82f6" opacity="0.08"/>
  <ellipse cx="200" cy="500" rx="280" ry="200" fill="#8b5cf6" opacity="0.06"/>

  <rect x="48" y="48" width="1104" height="534" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="80" y="90" fill="#93c5fd" font-size="14" font-family="PingFang SC, Microsoft YaHei, sans-serif" letter-spacing="6">FULL HOUSE PACKAGE</text>
  <text x="80" y="130" fill="#e2e8f0" font-size="30" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" letter-spacing="4">全屋硬装特惠</text>

  <text x="80" y="220" fill="#f8fafc" font-size="52" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="800">100㎡以内</text>

  <!-- 价格艺术字 -->
  <text x="80" y="330" fill="none" stroke="#4338ca" stroke-width="3" font-size="96" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="900" filter="url(#glow)">38888</text>
  <text x="80" y="330" fill="url(#price)" font-size="96" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="900">38888</text>
  <text x="500" y="320" fill="#e2e8f0" font-size="40" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">元起</text>

  <line x1="80" y1="360" x2="560" y2="360" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>

  <text x="80" y="400" fill="#cbd5e1" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif">包工包料 · 水电泥瓦木油全包 · 透明报价</text>
  <text x="80" y="440" fill="#94a3b8" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">尚润装饰品质保障 · 隐蔽工程5年质保</text>

  <!-- 右侧套餐示意 -->
  <rect x="720" y="100" width="400" height="400" rx="12" fill="#0f172a" stroke="url(#accent)" stroke-width="1.5"/>
  <rect x="720" y="100" width="400" height="80" rx="12" fill="url(#shine)"/>
  <text x="920" y="155" text-anchor="middle" fill="url(#accent)" font-size="24" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">硬装全包套餐</text>
  <rect x="760" y="200" width="320" height="14" rx="4" fill="url(#accent)" opacity="0.7"/>
  <text x="780" y="212" fill="#0f172a" font-size="11" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">水电改造</text>
  <rect x="760" y="240" width="280" height="14" rx="4" fill="#6366f1" opacity="0.6"/>
  <text x="780" y="252" fill="#e2e8f0" font-size="11" font-family="PingFang SC, Microsoft YaHei, sans-serif">泥瓦工程</text>
  <rect x="760" y="280" width="300" height="14" rx="4" fill="#8b5cf6" opacity="0.55"/>
  <text x="780" y="292" fill="#e2e8f0" font-size="11" font-family="PingFang SC, Microsoft YaHei, sans-serif">木工工程</text>
  <rect x="760" y="320" width="260" height="14" rx="4" fill="#a78bfa" opacity="0.5"/>
  <text x="780" y="332" fill="#e2e8f0" font-size="11" font-family="PingFang SC, Microsoft YaHei, sans-serif">油漆工程</text>
  <rect x="760" y="360" width="240" height="14" rx="4" fill="#c4b5fd" opacity="0.45"/>
  <text x="780" y="372" fill="#e2e8f0" font-size="11" font-family="PingFang SC, Microsoft YaHei, sans-serif">辅材人工</text>
  <text x="920" y="450" text-anchor="middle" fill="#64748b" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif">一口价 · 无隐藏增项</text>

  <rect x="0" y="560" width="1200" height="70" fill="#030712" opacity="0.8"/>
  <text x="600" y="605" text-anchor="middle" fill="#93c5fd" font-size="18" font-family="PingFang SC, Microsoft YaHei, sans-serif" letter-spacing="4">尚润装饰 · 品质装修</text>
</svg>
