<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="35%" stop-color="#7f1d1d"/>
      <stop offset="70%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fbbf24" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1050" cy="100" r="200" fill="#fbbf24" opacity="0.1"/>
  <circle cx="100" cy="530" r="160" fill="#ffffff" opacity="0.04"/>

  <!-- 飘带装饰 -->
  <path d="M0 120 Q300 80 600 140 T1200 100" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.2"/>
  <path d="M0 500 Q400 460 800 520 T1200 480" stroke="#fde68a" stroke-width="1.5" fill="none" opacity="0.15"/>

  <text x="72" y="56" fill="#fde68a" font-size="14" font-family="PingFang SC, Microsoft YaHei, sans-serif" letter-spacing="6" opacity="0.8">NATIONAL DAY SPECIAL</text>
  <text x="72" y="100" fill="#fecaca" font-size="26" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="600" letter-spacing="6">国庆家装大促</text>

  <!-- 艺术字主标题 -->
  <text x="72" y="210" fill="none" stroke="#92400e" stroke-width="3" font-size="88" font-family="PingFang SC, Microsoft YaHei, serif" font-weight="900" filter="url(#glow)">1元定金</text>
  <text x="72" y="210" fill="url(#goldV)" font-size="88" font-family="PingFang SC, Microsoft YaHei, serif" font-weight="900">1元定金</text>
  <text x="72" y="310" fill="none" stroke="#b45309" stroke-width="2.5" font-size="76" font-family="PingFang SC, Microsoft YaHei, serif" font-weight="900">抵1000元</text>
  <text x="72" y="310" fill="url(#gold)" font-size="76" font-family="PingFang SC, Microsoft YaHei, serif" font-weight="900">抵1000元</text>

  <rect x="72" y="340" width="400" height="52" rx="26" fill="url(#gold)"/>
  <text x="272" y="375" text-anchor="middle" fill="#7f1d1d" font-size="24" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="800">限时抢购 · 名额有限</text>

  <text x="72" y="450" fill="#fecaca" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif">免费量房 · 免费设计 · 材料升级礼</text>
  <text x="72" y="490" fill="#fca5a5" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" letter-spacing="2">8.18 起火热预约 · 国庆专享</text>

  <!-- 右侧大数字 -->
  <rect x="720" y="80" width="400" height="420" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="url(#gold)" stroke-width="2"/>
  <text x="920" y="300" text-anchor="middle" fill="none" stroke="#fbbf24" stroke-width="4" font-size="200" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="900" opacity="0.5">1</text>
  <text x="920" y="300" text-anchor="middle" fill="url(#goldV)" font-size="200" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="900">1</text>
  <text x="920" y="380" text-anchor="middle" fill="#ffffff" font-size="36" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">元抢定</text>
  <text x="920" y="430" text-anchor="middle" fill="#fbbf24" font-size="26" font-family="PingFang SC, Microsoft YaHei, sans-serif">签约立减1000</text>

  <rect x="0" y="560" width="1200" height="70" fill="#1a0505" opacity="0.7"/>
  <text x="600" y="605" text-anchor="middle" fill="#fde68a" font-size="18" font-family="PingFang SC, Microsoft YaHei, sans-serif" letter-spacing="4">尚润装饰 · 品质装修</text>
</svg>
